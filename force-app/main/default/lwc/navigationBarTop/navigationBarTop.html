                <div class="logo-image">
                    <template if:true={imageLogoSite}>
                        <img src={imageLogoSite} width="260"/>
                    </template>
                </div>
            </div>
            <div></div>

            <!-- Consultant Section -->
            <template if:true={consultantName}>
                <div class="consultant-container">
                    <div class="consultant-photo-subcontainer">
                        <template if:true={consultantPhotoUrl}>
                            <img src={consultantPhotoUrl} class="consultant-photo" alt="Consultant"/>
                        </template>
                        <template if:false={consultantPhotoUrl}>
                            <!-- Placeholder icon when consultant has no photo -->
                            <svg class="consultant-placeholder-icon" width="60" height="60" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="20" cy="20" r="20" fill="#E8E8E8"/>
                                <path d="M20 18C22.21 18 24 16.21 24 14C24 11.79 22.21 10 20 10C17.79 10 16 11.79 16 14C16 16.21 17.79 18 20 18ZM20 22C17.33 22 12 23.34 12 26V30H28V26C28 23.34 22.67 22 20 22Z" fill="#757575"/>
                            </svg>
                        </template>
                    </div>
                    <div class="consultant-info">
                        <div class="consultant-name">{consultantName}</div>
                        <div class="consultant-title">Retire Now Consultant</div>
                        <div class="consultant-phone">{consultantPhone}</div>
                    </div>
                </div>
            </template>
            <div class="profile-container">
                <div class="profile-image-subcontainer">
                    <template if:true={userPhotoUrl}>
                        <img src={userPhotoUrl} class="profile-image"/>
                    </template>
                    <template if:false={userPhotoUrl}>
                        <!-- Placeholder icon when user has no photo -->
                        <svg class="profile-placeholder-icon" width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="20" cy="20" r="20" fill="#E8E8E8"/>
                            <path d="M20 18C22.21 18 24 16.21 24 14C24 11.79 22.21 10 20 10C17.79 10 16 11.79 16 14C16 16.21 17.79 18 20 18ZM20 22C17.33 22 12 23.34 12 26V30H28V26C28 23.34 22.67 22 20 22Z" fill="#757575"/>
                        </svg>
                    </template>
                </div>

                <div class="profile-name">
                    <template if:true={userName}>
                        {userName}
                    </template>
                </div>

                <div class="profile-dropdown">
                    <div class="dropdown-button" onclick={toggleProfileMenu}>
                        <svg width="14" height="8" viewBox="0 0 14 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M1 1L7 7L13 1" stroke="#757575" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                
                    <div class={dropdownMenuCssStyle} onmouseleave={closeProfileMenu}>
                        <div class="menuItem">
                            <div class="menuItemIcon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" data-row-id="1">
                                    <path data-row-id="1" d="M20 21V19C20 17.9391 19.5786 16.9217 18.8284 16.1716C18.0783 15.4214 17.0609 15 16 15H8C6.93913 15 5.92172 15.4214 5.17157 16.1716C4.42143 16.9217 4 17.9391 4 19V21M16 7C16 9.20914 14.2091 11 12 11C9.79086 11 8 9.20914 8 7C8 4.79086 9.79086 3 12 3C14.2091 3 16 4.79086 16 7Z" stroke="#616161" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </div>
                            <div class="menuItemLabel" onclick={showMyProfilePage}>
                                Profile settings
                            </div>
                        </div>
                        <div class="menuItem">
                            <div class="menuItemIcon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none" data-row-id="6">
                                    <path data-row-id="6" d="M7.5 17.5H4.16667C3.72464 17.5 3.30072 17.3244 2.98816 17.0118C2.67559 16.6993 2.5 16.2754 2.5 15.8333V4.16667C2.5 3.72464 2.67559 3.30072 2.98816 2.98816C3.30072 2.67559 3.72464 2.5 4.16667 2.5H7.5" stroke="#616161" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path data-row-id="6" d="M13.333 14.1667L17.4997 10L13.333 5.83337" stroke="#616161" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path data-row-id="6" d="M17.5 10H7.5" stroke="#616161" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </div>
                            <div class="menuItemLabel" onclick={callStandardLogout}>
                                Logout
                            </div>
                        </div>
                    </div>   
                </div>

            </div>
        </div>
    </div>
    </template>
</template>
