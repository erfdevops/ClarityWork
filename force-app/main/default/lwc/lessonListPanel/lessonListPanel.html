<template>
    <div class="slds-card" style="min-height: 600px; background: #fff;">
        <div class="slds-p-around_medium">
            <div class="slds-grid slds-m-bottom_medium slds-align_absolute-center">
                <div class="slds-col slds-size_1-of-12">
                    <lightning-button-icon icon-name="utility:back" alternative-text="Back" onclick={handleBack} variant="bare"></lightning-button-icon>
                </div>
                <div class="slds-col slds-size_11-of-12 slds-text-heading_medium" style="font-weight:700;">
                    {courseTitle}
                </div>
            </div>
            <div>
                <template for:each={lessons} for:item="lesson">
                    <div key={lesson.id} style="margin-bottom: 16px;">
                        <template if:true={lesson.selected}>
                            <!-- Selected Lesson -->
                            <template if:true={lesson.isLesson}>
                                <div style="border:2px solid #004e14; border-radius:6px; background:linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%); padding:18px 20px; font-weight:600; color:#2d2d2d; cursor:pointer;" 
                                     onclick={handleLessonClick} data-id={lesson.id}>
                                    {lesson.title}
                                </div>
                            </template>
                            <!-- Selected Assignment -->
                            <template if:false={lesson.isLesson}>
                                <div style="border:2px solid #004e14; border-radius:6px; background:linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%); padding:18px 20px; font-weight:600; color:#2d2d2d; cursor:pointer;" 
                                     onclick={handleLessonClick} data-id={lesson.id}>
                                    {lesson.title}
                                </div>
                            </template>
                        </template>
                        <template if:false={lesson.selected}>
                            <div style="border:1.5px solid #e6e6e6; border-radius:6px; background:#fff; padding:18px 20px; font-weight:500; color:#2d2d2d; cursor:pointer; transition: all 0.2s ease;" 
                                 onclick={handleLessonClick} data-id={lesson.id}
                                 onmouseenter={handleMouseEnter} onmouseleave={handleMouseLeave}>
                                {lesson.title}
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>
    </div>
</template>
