<template>
    <template if:true={isDesktopScreen}>
        <div class="layout-container" style={backgroundStyle}>
            <div class="logo-top">
                <template if:true={imageLogoLogin}>
                    <img src={imageLogoLogin} width="250"/>
                </template>
            </div>
            <div class="login-card-layout">
                <div class="login-texts-container">
                    <div class="login-heading">
                        Password Reset
                    </div>
                    <div class="login-description">
                        To reset your password, enter your username. We'll send a reset-password link to the email address associated with your account.
                    </div>
                    <template if:true={showSuccessMessage}>
                        <div class="success-message">
                            Password reset email sent! Please check your inbox.
                        </div>
                    </template>
                    <template if:true={showError}>
                        <div class="error-message">
                            {errorMessage}
                        </div>
                    </template>
                </div>
                <div class="input-btn-container">
                    <div class="input-login-btn-container">
                        <div class="inputs-container">
                            <input type="text" class="mat-input" tabindex="0" data-field="username" placeholder="Username" oninput={handleUsernameChange} value={userName}>
                        </div>
                        <div class="buttons-container">
                            <div class="button-reset" onclick={handleReset}>Reset</div>
                            <div class="button-cancel" onclick={handleCancel}>Cancel</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template if:false={isDesktopScreen}>
        <div class="mobile-layout-container" style={backgroundStyle}>
            <div style="height: 52px; width: 250px; transform: scale(1.2);">
            </div>
            <div class="mobile-login-card-layout">
                <div class="mobile-login-texts-container">
                    <div class="mobile-login-heading">Login</div>
                    <div class="mobile-login-description">Lorem ipsum dolor sit amet, elit consectetur elit.</div>
                </div>
                <div class="mobile-input-btn-container">
                    <div class="mobile-input-login-btn-container">
                        <div class="mobile-inputs-container">
                            <input type="text" class="mobile-mat-input" tabindex="0" data-field="username" placeholder="Username" oninput={handleUsernameChange}>
                            <input type="password" class="mobile-mat-input" tabindex="0" data-field="password" placeholder="Password" oninput={handlePasswordChange}>
                        </div>
                        <div class="mobile-btn-login">Login</div>
                    </div>
                    <div class="forgetPassword-btn">Forgot your password ?</div>
                </div>
            </div>
        </div>
    </template>
</template>
