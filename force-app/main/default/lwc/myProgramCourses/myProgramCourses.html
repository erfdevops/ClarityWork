<template>
    <div class="courses-panel-container">
        <div class="panel-content">
            <div class="panel-header">
                <h2 class="panel-title">Modules</h2>
                <select 
                    class="journey-selector"
                    onchange={handleJourneyChange}>
                    <option value="">Select Journey</option>
                    <template for:each={journeyOptions} for:item="option">
                        <option key={option.value} value={option.value} selected={option.selected}>{option.label}</option>
                    </template>
                </select>
            </div>
            
            <!-- Empty State -->
            <template if:true={isEmpty}>
                <div class="empty-state-container">
                    <img src={emptyStateImageUrl} alt="No data found" class="empty-state-image">
                    <h3 class="empty-state-title">No Courses Available</h3>
                    <p class="empty-state-message">{emptyStateMessage}</p>
                </div>
            </template>
            
            <!-- Courses Content -->
            <template if:false={isEmpty}>
            <div class="courses-list-wrapper">
            <div class="slds-grid slds-wrap">
                <template for:each={courses} for:item="course">
                    <div key={course.id} class="slds-size_1-of-1 slds-m-bottom_medium">
                        <template if:true={course.selected}>
                            <div class="course-card course-card--selected" style="cursor:pointer;" data-id={course.id} onclick={handleSelect}>
                                <div class="course-content slds-p-around_medium">
                                    <!-- Course Header -->
                                    <div class="slds-grid slds-gutters slds-wrap">
                                        <!-- Course Image -->
                                        <div class="slds-col slds-size_1-of-3 slds-medium-size_1-of-4">
                                            <div class="course-image">
                                                <template if:true={course.badge}>
                                                    <lightning-formatted-rich-text value={course.badge}></lightning-formatted-rich-text>
                                                </template>
                                                <template if:false={course.badge}>
                                                    <!-- Fallback when no badge is available -->
                                                </template>
                                            </div>
                                        </div>
                                        <!-- Course Details -->
                                        <div class="slds-col slds-size_2-of-3 slds-medium-size_3-of-4">
                                            <div class="course-header">
                                                <div class="course-module slds-text-body_small slds-text-color_weak slds-m-bottom_xx-small">{course.moduleCode}</div>
                                                <h3 class="course-title slds-text-heading_medium slds-m-bottom_xx-small">{course.title}</h3>
                                                <p class="course-description slds-text-body_regular slds-text-color_weak slds-m-bottom_small">{course.description}</p>
                                                
                                                <!-- Tags -->
                                                <div class="course-tags slds-m-bottom_small">
                                                    <template for:each={course.tags} for:item="tag">
                                                        <span key={tag} class="course-tag slds-badge slds-m-right_x-small">{tag}</span>
                                                    </template>
                                                </div>
                                                
                                                <!-- Course Meta -->
                                                <template if:true={showCourseDetails}>
                                                    <div class="course-meta slds-grid slds-gutters slds-m-bottom_small">
                                                        <div class="slds-col">
                                                            <span class="slds-text-body_small slds-text-color_weak">Duration: </span>
                                                            <span class="slds-text-body_small">{course.duration}</span>
                                                        </div>
                                                        <div class="slds-col">
                                                            <span class="slds-text-body_small slds-text-color_weak">Points: </span>
                                                            <span class="slds-text-body_small">{course.points}</span>
                                                        </div>
                                                    </div>
                                                </template>
                                                
                                                <!-- Designer Info -->
                                                <div class="course-designer slds-grid slds-gutters slds-m-bottom_small">
                                                    <div class="slds-col">
                                                        <span class="slds-text-body_small slds-text-color_weak">Design by : </span>
                                                        <span class="slds-avatar slds-avatar_circle slds-avatar_x-small slds-m-horizontal_xx-small">
                                                            <lightning-icon icon-name="standard:user" size="x-small"></lightning-icon>
                                                        </span>
                                                        <span class="slds-text-body_small">{course.designer}</span>
                                                    </div>
                                                </div>
                                                
                                                <!-- Course Stats and Actions -->
                                                <div class="course-footer slds-grid slds-gutters slds-grid_align-spread">
                                                    <div class="slds-col">
                                                        <span class="progress-badge">{course.progress}</span>
                                                    </div>
                                                    <div class="slds-col slds-text-align_right">
                                                        <div class="course-actions slds-grid slds-gutters slds-grid_align-end">
                                                            <div class="slds-col slds-text-align_right">
                                                               <!-- <lightning-icon icon-name="utility:share" size="x-small" class="action-icon slds-m-right_small"></lightning-icon>
                                                                <lightning-icon icon-name="utility:favorite" size="x-small" class="action-icon slds-m-right_small"></lightning-icon>
                                                                <lightning-icon icon-name="utility:comments" size="x-small" class="action-icon slds-m-right_xx-small"></lightning-icon>
                                                                <span class="action-count slds-m-right_small">{course.comments}</span>
                                                                <lightning-icon icon-name="utility:edit" size="x-small" class="action-icon slds-m-right_xx-small"></lightning-icon>
                                                                <span class="action-count">{course.edits}</span>
                                                                -->
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                        <template if:false={course.selected}>
                            <div class="course-card" style="cursor:pointer;" data-id={course.id} onclick={handleSelect}>
                                <div class="course-content slds-p-around_medium">
                                    <!-- Course Header -->
                                    <div class="slds-grid slds-gutters slds-wrap">
                                        <!-- Course Image -->
                                        <div class="slds-col slds-size_1-of-3 slds-medium-size_1-of-4">
                                            <div class="course-image">
                                                <template if:true={course.badge}>
                                                    <lightning-formatted-rich-text value={course.badge}></lightning-formatted-rich-text>
                                                </template>
                                                <template if:false={course.badge}>
                                                    <!-- Fallback when no badge is available -->
                                                </template>
                                            </div>
                                        </div>
                                        <!-- Course Details -->
                                        <div class="slds-col slds-size_2-of-3 slds-medium-size_3-of-4">
                                            <div class="course-header">
                                                <div class="course-module slds-text-body_small slds-text-color_weak slds-m-bottom_xx-small">{course.moduleCode}</div>
                                                <h3 class="course-title slds-text-heading_medium slds-m-bottom_xx-small">{course.title}</h3>
                                                <p class="course-description slds-text-body_regular slds-text-color_weak slds-m-bottom_small">{course.description}</p>
                                                
                                                <!-- Tags -->
                                                <div class="course-tags slds-m-bottom_small">
                                                    <template for:each={course.tags} for:item="tag">
                                                        <span key={tag} class="course-tag slds-badge slds-m-right_x-small">{tag}</span>
                                                    </template>
                                                </div>
                                                
                                                <!-- Course Meta -->
                                                <template if:true={showCourseDetails}>
                                                    <div class="course-meta slds-grid slds-gutters slds-m-bottom_small">
                                                        <div class="slds-col">
                                                            <span class="slds-text-body_small slds-text-color_weak">Duration: </span>
                                                            <span class="slds-text-body_small">{course.duration}</span>
                                                        </div>
                                                        <div class="slds-col">
                                                            <span class="slds-text-body_small slds-text-color_weak">Point: </span>
                                                            <span class="slds-text-body_small">{course.points}</span>
                                                        </div>
                                                    </div>
                                                </template>
                                                
                                                <!-- Designer Info -->
                                                <div class="course-designer slds-grid slds-gutters slds-m-bottom_small">
                                                    <div class="slds-col">
                                                        <span class="slds-text-body_small slds-text-color_weak">Design by : </span>
                                                        <span class="slds-avatar slds-avatar_circle slds-avatar_x-small slds-m-horizontal_xx-small">
                                                            <lightning-icon icon-name="standard:user" size="x-small"></lightning-icon>
                                                        </span>
                                                        <span class="slds-text-body_small">{course.designer}</span>
                                                    </div>
                                                </div>
                                                
                                                <!-- Course Stats and Actions -->
                                                <div class="course-footer slds-grid slds-gutters slds-grid_align-spread">
                                                    <div class="slds-col">
                                                        <span class="progress-badge">{course.progress}</span>
                                                    </div>
                                                    <div class="slds-col slds-text-align_right">
                                                        <div class="course-actions slds-grid slds-gutters slds-grid_align-end">
                                                            <div class="slds-col slds-text-align_right">
                                                       <!--         <lightning-icon icon-name="utility:share" size="x-small" class="action-icon slds-m-right_small"></lightning-icon>
                                                                <lightning-icon icon-name="utility:favorite" size="x-small" class="action-icon slds-m-right_small"></lightning-icon>
                                                                <lightning-icon icon-name="utility:comments" size="x-small" class="action-icon slds-m-right_xx-small"></lightning-icon>
                                                                <span class="action-count slds-m-right_small">{course.comments}</span>
                                                                <lightning-icon icon-name="utility:edit" size="x-small" class="action-icon slds-m-right_xx-small"></lightning-icon>
                                                                <span class="action-count">{course.edits}</span>
                                                                -->
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
            </div>
            </template>
        </div>
    </div>
</template>
